name: rizal_apps
description: "Rizal Docs - Aplikasi Repositori dan Koleksi Dokumen (UTS Mobile Programming)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Penyimpanan lokal (SQLite) untuk data user dan dokumen.
  sqflite: ^2.4.2
  # Utilitas path untuk menentukan lokasi file database.
  path: ^1.9.1
  # Format tanggal Indonesia pada halaman detail dokumen.
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Seluruh gambar diambil dari aset lokal, bukan dari internet.
  assets:
    - assets/images/profile/
    - assets/images/brand/
    - assets/images/covers/
